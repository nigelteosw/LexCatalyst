services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lexcatalyst-postgres
    environment:
      POSTGRES_DB: lexcatalyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lexcatalyst"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
