name: Release Birdie extension

# On every push to main that changes the extension: test, bump the patch version, build,
# commit the bump, tag it, and publish birdie-extension-<version>.zip as a GitHub Release.
on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-release.yml"
  workflow_dispatch:

# Serialise releases so two pushes can't race for the same version number.
concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip the bump commit this workflow pushes (belt and braces: GITHUB_TOKEN pushes don't retrigger anyway).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Bump version
        id: bump
        run: echo "version=$(node scripts/bump-version.mjs)" >> "$GITHUB_OUTPUT"

      # VITE_GOOGLE_CLIENT_ID is a public OAuth client id (set as a repository variable, not a secret).
      # VITE_API_URL is omitted on purpose: the build defaults to the Railway production API.
      - name: Build and package
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          bun run build
          cd dist && zip -qr "../birdie-extension-${{ steps.bump.outputs.version }}.zip" .

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json public/manifest.json
          git commit -m "chore(extension): release v${{ steps.bump.outputs.version }} [skip ci]"
          git pull --rebase origin main
          git tag "extension-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "extension-v${{ steps.bump.outputs.version }}" \
            "birdie-extension-${{ steps.bump.outputs.version }}.zip" \
            --title "Birdie extension v${{ steps.bump.outputs.version }}" \
            --generate-notes
